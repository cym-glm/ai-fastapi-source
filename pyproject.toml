[project]
name = "ai-fastapi-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
